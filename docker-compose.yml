networks:
  net:
    driver: bridge

services:
  preventech:
    networks:
      - net
    image: preventech

    build: .
    ports:
      - "8080:8080"
    depends_on:
      db: 
        condition: service_healthy
        restart: true
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=preventech;Username=preventech;Password=1234
    command: dotnet Preventech.Server.dll

  db:
    image: postgres:alpine
    restart: always
    networks:
      - net
    environment:
      POSTGRES_DB: Preventech
      POSTGRES_USER: preventech
      POSTGRES_PASSWORD: 1234
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preventech -d Preventech"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  pgdata: